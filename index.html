/* ================= file: salva, apri, esporta ================= */
function fileBase() {
  return (doc.title || 'schema').trim().replace(/[\\/:*?"<>|]+/g, '').replace(/[\s–—-]+/g, '-').slice(0, 60) || 'schema';
}
async function offerFile(filename, data, mime) {
  let dl = null;
  try { if (window.claude && typeof window.claude.use === 'function') dl = await window.claude.use('downloads'); } catch (e) { dl = null; }
  if (dl) {
    try { await dl.save({ filename, data }); toast(`Salvato: ${filename}`); }
    catch (err) {
      const code = err && err.code;
      if (code === 'declined') return;
      // la pagina pubblicata accetta solo alcune estensioni: il file .ermes diventa .ermes.json
      if ((code === 'rejected_extension' || code === 'extension_not_enabled') && filename.endsWith('.' + EXT)) {
        return offerFile(filename + '.json', data, mime);
      }
      toast('Il salvataggio non è riuscito in questa vista.');
    }
    return;
  }
  const blob = data instanceof Blob ? data : new Blob([data], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
  toast(`Salvato: ${filename}`);
}
function schemaJson(pretty) {
  return JSON.stringify({ ...doc, format: FORMAT, version: 1, savedAt: new Date().toISOString() }, null, pretty ? 2 : 0);
}
function saveFile() {
  commitRename();
  offerFile(`${fileBase()}.${EXT}`, schemaJson(true), 'application/json');
}

/* ================= schema dentro il PNG =================
   Il PNG è una sequenza di blocchi. Aggiungiamo un blocco di testo iTXt con chiave "ermes"
   che contiene il JSON dello schema: i visualizzatori lo ignorano, ERmes lo rilegge con Apri.
   Si perde se l'immagine viene ricodificata (copia e incolla, app che comprimono, programmi di grafica). */
const PNG_SIG = [137, 80, 78, 71, 13, 10, 26, 10];
const PNG_KEY = 'ermes';
const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; }
  return t;
})();
function crc32(bytes) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
function isPng(buf) { return buf.length > 8 && PNG_SIG.every((v, i) => buf[i] === v); }
function pngChunks(buf) {
  const out = [], dv = new DataView(buf.buffer, buf.byteOffset, buf.byteLength);
  let p = 8;
  while (p + 12 <= buf.length) {
    const len = dv.getUint32(p), type = String.fromCharCode(...buf.subarray(p + 4, p + 8));
    out.push({ pos: p, len, type, data: buf.subarray(p + 8, p + 8 + len) });
    if (type === 'IEND') break;
    p += 12 + len;
  }
  return out;
}
function iTXtChunk(keyword, text) {
  const enc = new TextEncoder(), kw = enc.encode(keyword), tx = enc.encode(text);
  // parola chiave \0, non compresso (0), metodo (0), lingua \0, parola chiave tradotta \0, testo UTF-8
  const data = new Uint8Array(kw.length + 5 + tx.length);
  data.set(kw, 0); data.set(tx, kw.length + 5);
  const chunk = new Uint8Array(12 + data.length), dv = new DataView(chunk.buffer);
  dv.setUint32(0, data.length);
  chunk.set(enc.encode('iTXt'), 4); chunk.set(data, 8);
  dv.setUint32(8 + data.length, crc32(chunk.subarray(4, 8 + data.length)));
  return chunk;
}
async function pngWithSchema(blob, json) {
  const buf = new Uint8Array(await blob.arrayBuffer());
  const iend = pngChunks(buf).find(c => c.type === 'IEND');
  if (!isPng(buf) || !iend) return blob;
  const extra = iTXtChunk(PNG_KEY, json);
  const out = new Uint8Array(buf.length + extra.length);
  out.set(buf.subarray(0, iend.pos), 0);
  out.set(extra, iend.pos);
  out.set(buf.subarray(iend.pos), iend.pos + extra.length);
  return new Blob([out], { type: 'image/png' });
}
function schemaFromPng(buf) {
  const latin1 = b => String.fromCharCode(...b);
  for (const c of pngChunks(buf)) {
    if (c.type !== 'iTXt' && c.type !== 'tEXt') continue;
    const z = c.data.indexOf(0);
    if (z < 0 || latin1(c.data.subarray(0, z)) !== PNG_KEY) continue;
    if (c.type === 'tEXt') return latin1(c.data.subarray(z + 1));
    if (c.data[z + 1] !== 0) return null;             // testo compresso: ERmes non lo scrive mai
    let q = c.data.indexOf(0, z + 3) + 1;             // salta la lingua
    q = c.data.indexOf(0, q) + 1;                     // e la parola chiave tradotta
    return new TextDecoder().decode(c.data.subarray(q));
  }
  return null;
}
function normalize(o) {
  if (!o || typeof o !== 'object' || !Array.isArray(o.nodes) || !Array.isArray(o.links)) throw new Error('struttura');
  if (o.format && o.format !== FORMAT && o.format !== 'modellatore-er') throw new Error('formato');
  const kinds = new Set(['entity', 'relationship', 'attribute']);
  const nodes = o.nodes.filter(n => n && kinds.has(n.kind) && n.id).map(n => ({
    id: String(n.id), kind: n.kind, x: +n.x || 0, y: +n.y || 0, name: String(n.name ?? ''),
    key: !!n.key, card: n.card ? String(n.card) : '',
    genTotal: !!n.genTotal, genExclusive: n.genExclusive !== false
  }));
  const ids = new Set(nodes.map(n => n.id));
  const lk = new Set(['participation', 'attribute', 'isa']);
  const links = o.links.filter(l => l && lk.has(l.kind) && ids.has(String(l.a)) && ids.has(String(l.b))).map(l => {
    const base = { id: String(l.id || uid()), kind: l.kind, a: String(l.a), b: String(l.b) };
    if (l.kind !== 'participation') return base;
    const card = CARDS.includes(l.card) ? l.card : '(0,N)';
    return { ...base, card, key: !!l.key && card === '(1,1)' };
  });
  // le entità figlie ereditano l'identificatore: eventuali identificatori propri vengono ignorati
  const children = new Set(links.filter(l => l.kind === 'isa').map(l => l.a));
  const byId = Object.fromEntries(nodes.map(n => [n.id, n]));
  for (const l of links) {
    if (l.kind === 'attribute' && children.has(l.b) && byId[l.a]) byId[l.a].key = false;
    if (l.kind === 'participation' && children.has(l.a)) l.key = false;
  }
  return { format: FORMAT, version: 1, title: String(o.title || 'Schema senza titolo'), style: 'atzeni', nodes, links };
}
function loadDoc(newDoc, message) {
  const before = snapshot();
  doc = newDoc; sel = new Set(); setModeSilently();
  pushUndo(before);
  render(true); fitView();
  toast(message, 'Annulla', undo);
}
function setModeSilently() { mode = null; modeFrom = null; }
$('#file-input').addEventListener('change', e => {
  const file = e.target.files[0]; e.target.value = '';
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    const buf = new Uint8Array(reader.result);
    if (isPng(buf)) {
      const json = schemaFromPng(buf);
      if (!json) {
        toast("Questa immagine non contiene uno schema di ERmes. Forse è stata copiata, compressa o modificata da un altro programma: se ce l'hai, apri il file .ermes.");
        return;
      }
      try { loadDoc(normalize(JSON.parse(json)), `Aperto dall'immagine: ${file.name}`); }
      catch (err) { toast("Lo schema dentro questa immagine è danneggiato: se ce l'hai, apri il file .ermes."); }
      return;
    }
    try { loadDoc(normalize(JSON.parse(new TextDecoder().decode(buf))), `Aperto: ${file.name}`); }
    catch (err) { toast(`Questo file non è uno schema di ERmes: apri un file .${EXT} o un'immagine PNG esportata da ERmes.`); }
  };
  reader.onerror = () => toast('Non riesco a leggere il file.');
  reader.readAsArrayBuffer(file);
});

function exportSvgString() {
  const b = diagramBox(); if (!b) return null;
  const pad = 36, x = Math.floor(b.x1 - pad), y = Math.floor(b.y1 - pad);
  const w = Math.ceil(b.x2 - b.x1 + pad * 2), h = Math.ceil(b.y2 - b.y1 + pad * 2);
  const body = drawDiagram(PRINT, {}).replace(/ data-(node|link)="[^"]*"/g, '');
  const str = `<svg xmlns="${NS}" width="${w}" height="${h}" viewBox="${x} ${y} ${w} ${h}">`
    + `<title>${esc(doc.title)}</title><rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#ffffff"/>${body}</svg>`;
  return { str, w, h };
}
function exportSvg() {
  commitRename();
  const r = exportSvgString(); if (!r) { toast('Lo schema è vuoto: non c\'è niente da esportare.'); return; }
  offerFile(`${fileBase()}.svg`, '<?xml version="1.0" encoding="UTF-8"?>\n' + r.str, 'image/svg+xml');
}
function exportPng() {
  commitRename();
  const r = exportSvgString(); if (!r) { toast('Lo schema è vuoto: non c\'è niente da esportare.'); return; }
  const scale = 2, img = new Image();
  img.onload = () => {
    const c = document.createElement('canvas');
    c.width = r.w * scale; c.height = r.h * scale;
    const g = c.getContext('2d'); g.scale(scale, scale); g.drawImage(img, 0, 0, r.w, r.h);
    const json = schemaJson(false);
    c.toBlob(async b => {
      if (!b) { toast('Esportazione PNG non riuscita.'); return; }
      offerFile(`${fileBase()}.png`, await pngWithSchema(b, json), 'image/png');
    }, 'image/png');
  };
  img.onerror = () => toast('Esportazione PNG non riuscita.');
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(r.str);
}

/* ================= notifiche ================= */
let toastTimer = 0;
function toast(msg, actLabel, actFn) {
  const t = $('#toast'), b = $('#toast-act');
  $('#toast-msg').textContent = msg;
  if (actLabel) { b.textContent = actLabel; b.hidden = false; b.onclick = () => { actFn(); t.classList.remove('show'); }; }
  else { b.hidden = true; b.onclick = null; }
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), actLabel ? 6000 : 3200);
}

/* ================= comandi della barra ================= */
$('#btn-new').onclick = () => { commitRename(); loadDoc(emptyDoc(), 'Nuovo schema vuoto.'); };
$('#btn-open').onclick = () => $('#file-input').click();
$('#btn-save').onclick = saveFile;
$('#btn-png').onclick = exportPng;
$('#btn-svg').onclick = exportSvg;
$('#btn-undo').onclick = undo;
$('#btn-redo').onclick = redo;
$('#btn-fit').onclick = fitView;

/* tema chiaro / scuro: parte da quello del sistema, la scelta resta salvata in questo browser */
const THEME_KEY = 'ermes:theme', PANEL_KEY = 'ermes:panel';
const darkMq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
function currentTheme() {
  const t = document.documentElement.getAttribute('data-theme');
  return t === 'dark' || t === 'light' ? t : (darkMq && darkMq.matches ? 'dark' : 'light');
}
function syncThemeButton() {
  const label = currentTheme() === 'dark' ? 'Passa al tema chiaro' : 'Passa al tema scuro';
  $('#btn-theme').title = label; $('#btn-theme').setAttribute('aria-label', label);
}
let themeFadeTimer = 0;
function setTheme(t) {
  const root = document.documentElement;
  // i colori del disegno sono variabili CSS: non serve ridisegnare, così anche lo schema sfuma
  root.classList.add('theme-fade');
  void root.offsetWidth;
  root.setAttribute('data-theme', t);
  try { localStorage.setItem(THEME_KEY, t); } catch (e) { /* non disponibile */ }
  syncThemeButton();
  clearTimeout(themeFadeTimer);
  themeFadeTimer = setTimeout(() => root.classList.remove('theme-fade'), 600);
}
$('#btn-theme').onclick = () => setTheme(currentTheme() === 'dark' ? 'light' : 'dark');
if (darkMq && darkMq.addEventListener) darkMq.addEventListener('change', syncThemeButton);
// tema chiaro come predefinito; quello scuro solo se scelto con il pulsante
let savedTheme = null;
try { savedTheme = localStorage.getItem(THEME_KEY); } catch (e) { /* non disponibile */ }
document.documentElement.setAttribute('data-theme', savedTheme === 'dark' ? 'dark' : 'light');
syncThemeButton();

/* pannello delle proprietà a scomparsa */
function setPanel(open, save = true) {
  $('.main').classList.toggle('panel-off', !open);
  const b = $('#btn-panel');
  b.setAttribute('aria-pressed', String(open));
  b.title = open ? 'Nascondi il pannello delle proprietà (P)' : 'Mostra il pannello delle proprietà (P)';
  if (save) { try { localStorage.setItem(PANEL_KEY, open ? 'open' : 'closed'); } catch (e) { /* non disponibile */ } }
  render();
}
const panelOpen = () => !$('.main').classList.contains('panel-off');
$('#btn-panel').onclick = () => setPanel(!panelOpen());
try { if (localStorage.getItem(PANEL_KEY) === 'closed') setPanel(false, false); } catch (e) { /* non disponibile */ }
const zoomBtn = factor => { const r = stage.getBoundingClientRect(); zoomAt(view.k * factor, r.width / 2, r.height / 2); };
$('#btn-zoom-in').onclick = () => zoomBtn(1.2);
$('#btn-zoom-out').onclick = () => zoomBtn(1 / 1.2);
(() => {
  const t = $('#doc-title'); let before = null;
  t.addEventListener('focus', () => { before = snapshot(); });
  t.addEventListener('input', () => { doc.title = t.value; });
  t.addEventListener('change', () => {
    doc.title = t.value.trim() || 'Schema senza titolo'; t.value = doc.title;
    if (before && snapshot() !== before) pushUndo(before); before = snapshot(); render();
  });
  t.addEventListener('keydown', e => { if (e.key === 'Enter') t.blur(); });
})();

/* ================= tastiera ================= */
document.addEventListener('keydown', e => {
  const typing = e.target.closest && e.target.closest('input, select, textarea');
  const ctrl = e.ctrlKey || e.metaKey, key = e.key.toLowerCase();
  if (ctrl && key === 's') { e.preventDefault(); saveFile(); return; }
  if (ctrl && key === 'o') { e.preventDefault(); $('#file-input').click(); return; }
  if (typing) return;
  if (ctrl && key === 'z' && !e.shiftKey) { e.preventDefault(); undo(); return; }
  if (ctrl && (key === 'y' || (key === 'z' && e.shiftKey))) { e.preventDefault(); redo(); return; }
  if (ctrl && key === 'd') { e.preventDefault(); duplicateSelection(); return; }
  if (ctrl && key === 'a') { e.preventDefault(); sel = new Set(doc.nodes.map(n => n.id)); render(true); return; }
  if (ctrl && key === '0') { e.preventDefault(); fitView(); return; }
  if (ctrl) return;
  if (e.key === 'Escape') { closeMenu(); if (mode) setMode(null); else { sel = new Set(); render(true); } return; }
  if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); deleteSelection(); return; }
  if ((e.key === 'Enter' || e.key === 'F2') && sel.size === 1) { const id = [...sel][0]; if (nodeById(id)) { e.preventDefault(); startRename(id); } return; }
  if (e.key.startsWith('Arrow') && sel.size) {
    e.preventDefault();
    const step = e.shiftKey ? 1 : GRID, dx = e.key === 'ArrowLeft' ? -step : e.key === 'ArrowRight' ? step : 0, dy = e.key === 'ArrowUp' ? -step : e.key === 'ArrowDown' ? step : 0;
    const ids = [...sel].filter(nodeById); const all = new Set([...ids, ...attachedAttrs(ids)]);
    mutate(() => { all.forEach(id => { const n = nodeById(id); n.x += dx; n.y += dy; }); }, false);
    return;
  }
  const map = { e: 'entity', s: 'relationship', a: 'attribute', i: 'key' };
  if (map[key]) { e.preventDefault(); addFromPalette(map[key], null); return; }
  if (key === 'c') { setMode(mode === 'link' ? null : 'link'); return; }
  if (key === 'g') { setMode(mode === 'isa' ? null : 'isa'); return; }
  if (key === 'p') { setPanel(!panelOpen()); return; }
  if (key === '+' || key === '=') { zoomBtn(1.2); return; }
  if (key === '-') { zoomBtn(1 / 1.2); return; }
});
window.addEventListener('resize', () => { closeMenu(); commitRename(); render(); });

/* ================= avvio ================= */
let restored = null;
try {
  const raw = localStorage.getItem(STORE_KEY) || localStorage.getItem(OLD_STORE_KEY);
  if (raw) restored = normalize(JSON.parse(raw));
} catch (e) { restored = null; }
doc = restored || emptyDoc();
render(true);
requestAnimationFrame(fitView);
})();
</script>

</body>
